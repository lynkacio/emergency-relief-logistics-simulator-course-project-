[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergency-relief-logistics-simulator"
version = "0.1.0"
description = "A course project demonstrating graph and dynamic-programming algorithms through emergency logistics planning."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yanwei Zhang"}]
license = {text = "MIT"}

[project.scripts]
relief-planner = "relief_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
